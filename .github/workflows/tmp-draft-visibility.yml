name: TEMP draft visibility dry run (cli#37, remove before merge)

# Runs release.yml's check-step script verbatim against the existing draft
# v0.1.0-beta.30 with the workflow token at contents:write and at contents:read.
# Read-only: gh release view/download only; no dispatch, no release or tag change.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check-write:
    name: Draft check with contents:write (expect pass)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.0-beta.30
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version"; exit 1; }
          tag="v$VERSION"
          [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || { echo "$tag must be a draft release"; exit 1; }
          [ "$(jq -r .version npm/package.json)" = "$VERSION" ] || { echo "npm/package.json is not $VERSION"; exit 1; }
          [ "$(jq -r .version npm/releases.json)" = "$VERSION" ] || { echo "npm/releases.json is not $VERSION"; exit 1; }
          mkdir assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir assets --pattern '*.sha256'
          for p in darwin-arm64 darwin-x64 linux-x64; do
            f="assets/vibead-beta-$VERSION-$p.tar.gz.sha256"
            [ -f "$f" ] || { echo "draft has no $p archive"; exit 1; }
            want=$(jq -r --arg p "$p" '.platforms[$p] | if type == "string" then . else .sha256 end' npm/releases.json)
            [ "$(cut -d' ' -f1 "$f")" = "$want" ] || { echo "npm/releases.json $p does not match the release"; exit 1; }
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "check: PASS with contents:write"

  check-read:
    name: Draft check with contents:read (expect fail)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.0-beta.30
        run: |
          set +e
          bash -euo pipefail <<'CHECK'
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version"; exit 1; }
          tag="v$VERSION"
          [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || { echo "$tag must be a draft release"; exit 1; }
          [ "$(jq -r .version npm/package.json)" = "$VERSION" ] || { echo "npm/package.json is not $VERSION"; exit 1; }
          [ "$(jq -r .version npm/releases.json)" = "$VERSION" ] || { echo "npm/releases.json is not $VERSION"; exit 1; }
          mkdir assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir assets --pattern '*.sha256'
          for p in darwin-arm64 darwin-x64 linux-x64; do
            f="assets/vibead-beta-$VERSION-$p.tar.gz.sha256"
            [ -f "$f" ] || { echo "draft has no $p archive"; exit 1; }
            want=$(jq -r --arg p "$p" '.platforms[$p] | if type == "string" then . else .sha256 end' npm/releases.json)
            [ "$(cut -d' ' -f1 "$f")" = "$want" ] || { echo "npm/releases.json $p does not match the release"; exit 1; }
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          CHECK
          rc=$?
          echo "check exit code with contents:read: $rc"
          [ "$rc" -ne 0 ] || { echo "expected the draft to be invisible"; exit 1; }
          echo "check: FAILS with contents:read, as expected"
