name: TEMP beta.31 release.yml check dry run (remove before merge)

# Runs release.yml's `check` job scripts, extracted verbatim from release.yml at
# this commit, against the draft v0.1.0-beta.31, plus the npm job's check of the
# tgz against the draft's signed SHA256SUMS. Read-only: gh release view/download
# only (contents:write is needed only so the token can see the draft, as in
# release.yml). No dispatch, no signing, no upload, no publish, no tag.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dryrun:
    name: release.yml check on draft v0.1.0-beta.31 (dry run)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 0.1.0-beta.31
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm install -g 'npm@^11.5.1' && npm --version
      - name: Dry run
        run: |
          set -euo pipefail
          repo=$GITHUB_WORKSPACE
          step() { node --input-type=module -e "import {readFileSync} from 'node:fs'; import {stepRun} from '$repo/install/test/workflow-steps.mjs'; process.stdout.write(stepRun(readFileSync('$repo/.github/workflows/'+process.argv[1],'utf8'), process.argv[2]))" "$1" "$2"; }
          echo "== 1. release.yml check (id: check) @ $(git rev-parse --short HEAD)"
          bash -c "$(step release.yml check)" && echo "check: PASS"
          echo "== 2. release.yml 'Launcher tarball on the draft is npm pack of npm/' (npm $(npm --version))"
          bash -c "$(step release.yml 'Launcher tarball on the draft is npm pack of npm/')" && echo "tgz check: PASS"
          echo "== 3. release.yml npm job 'Check it against the signed SHA256SUMS' (draft's hand-signed SHA256SUMS)"
          mkdir signed && gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir signed --pattern SHA256SUMS --pattern "vibead-cli-$VERSION.tgz"
          echo "SHA256SUMS ($(wc -l < signed/SHA256SUMS) lines):"; cat signed/SHA256SUMS
          (cd signed && bash -c "$(step release.yml 'Check it against the signed SHA256SUMS')") && echo "npm-job check: PASS"
          echo "DRY RUN PASS (nothing signed, uploaded, tagged or published)"
