name: Release

# One manual run ships a version to every channel, in this order:
#   1. check the draft GitHub Release and the npm launcher files; the draft's
#      vibead-cli-X.tgz must be npm pack of npm/ at this commit
#   2. sign SHA256SUMS over the kits AND vibead-cli-X.tgz (sign-release.yml)
#   3. publish the Release: Latest only when npm_tag is latest; otherwise a
#      pre-release that is not Latest, so releases/latest and /install stay put
#   4. npm publish of that signed vibead-cli-X.tgz, byte for byte, via Trusted
#      Publishing (OIDC + provenance; no token, no OTP)
#   (Homebrew follows on its own: the tap repo polls npm `latest`; no token here)
# Promoting a version that is already on npm (cli#58): run with mode promote and
# the same version and npm_tag. It skips check, sign and npm publish, and runs
#   a. promote-npm: the published release's signed vibead-cli-X.tgz must be the
#      exact tarball npm holds (SHA-512 integrity); then `npm dist-tag add`
#      through Trusted Publishing (OIDC, no token)
#   b. promote-release: Latest on the GitHub Release (npm_tag latest only)
# It is safe to re-run. Rehearse with npm_tag next on a version that is already
# `next`: every step runs and nothing changes.
# Before running: the draft release vX exists with every archive and its
# .sha256 (from the vibead/vibead build) plus vibead-cli-X.tgz (npm pack in
# npm/) and its .sha256, and main has npm/package.json at X
# and npm/releases.json listing the same SHA-256s. Then bump install.json in
# vibead/vibead-ai so `curl | sh` follows. See install/README.md "Releasing".
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v, for example 0.1.0-beta.28
        required: true
      npm_tag:
        description: npm dist-tag to publish under (next until QA promotes a release)
        type: choice
        options: [next, beta, latest]
        default: next
      mode:
        description: release (draft to published and npm publish) or promote (the version is already on npm; add the dist-tag)
        type: choice
        options: [release, promote]
        default: release

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  check:
    name: Check draft release and npm launcher
    if: github.ref == 'refs/heads/main' && inputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # write, not read: GitHub shows DRAFT releases only to tokens with push
    # access, so with contents:read `gh release view/download` on the draft
    # says "release not found". This job only reads; write is for draft
    # visibility alone (dry run: cli#37). The other jobs that read the draft
    # (sign, publish-release) already have contents:write.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version"; exit 1; }
          tag="v$VERSION"
          [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || { echo "$tag must be a draft release"; exit 1; }
          [ "$(jq -r .version npm/package.json)" = "$VERSION" ] || { echo "npm/package.json is not $VERSION"; exit 1; }
          [ "$(jq -r .version npm/releases.json)" = "$VERSION" ] || { echo "npm/releases.json is not $VERSION"; exit 1; }
          mkdir assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir assets --pattern '*.sha256' --pattern "vibead-cli-$VERSION.tgz"
          for p in darwin-arm64 darwin-x64 linux-x64; do
            f="assets/vibead-beta-$VERSION-$p.tar.gz.sha256"
            [ -f "$f" ] || { echo "draft has no $p archive"; exit 1; }
            want=$(jq -r --arg p "$p" '.platforms[$p] | if type == "string" then . else .sha256 end' npm/releases.json)
            [ "$(cut -d' ' -f1 "$f")" = "$want" ] || { echo "npm/releases.json $p does not match the release"; exit 1; }
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # Same npm as the npm job and the documented `npm pack` (README step 1).
      - run: npm install -g 'npm@^11.5.1' && npm --version
      # The launcher tarball is signed in SHA256SUMS and then published to npm
      # byte for byte, so it must be exactly npm/ at this commit. The tar inside
      # is compared, not the gzip bytes (gzip output varies with the zlib build).
      - name: Launcher tarball on the draft is npm pack of npm/
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tgz="vibead-cli-$VERSION.tgz"
          [ -f "assets/$tgz" ] && [ -f "assets/$tgz.sha256" ] || { echo "draft has no $tgz and $tgz.sha256"; exit 1; }
          (cd assets && sha256sum -c "$tgz.sha256")
          mkdir -p packed
          (cd npm && npm pack --ignore-scripts --silent --pack-destination ../packed > /dev/null)
          [ -f "packed/$tgz" ] || { echo "npm pack did not make $tgz"; exit 1; }
          [ "$(gzip -dc "assets/$tgz" | sha256sum)" = "$(gzip -dc "packed/$tgz" | sha256sum)" ] || { echo "$tgz on the draft is not npm pack of npm/ at this commit"; exit 1; }
          echo "launcher tarball matches npm/: $tgz"

  sign:
    needs: check
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/sign-release.yml
    with:
      tag: ${{ needs.check.outputs.tag }}

  publish-release:
    name: Publish the GitHub Release (Latest only for npm_tag latest)
    needs: [check, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS
          if [ "$NPM_TAG" = latest ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          fi

  npm:
    name: npm publish (Trusted Publishing, provenance)
    needs: [check, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Optional protection: add required reviewers to the "npm" environment in
    # repo settings. The npm trusted-publisher entry must name the same environment.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing needs npm 11.5.1 or newer. No NODE_AUTH_TOKEN: npm
      # exchanges this job's OIDC token for a short-lived publish credential.
      - run: npm install -g 'npm@^11.5.1' && npm --version
      - working-directory: npm
        run: npm test
      # Publish the tarball that SHA256SUMS signs, not a fresh pack, so the npm
      # tarball is the signed one (REL-2). The release is public by now.
      - name: Download the signed launcher tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir signed
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir signed --pattern SHA256SUMS --pattern "vibead-cli-$VERSION.tgz"
      - name: Check it against the signed SHA256SUMS
        working-directory: signed
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tgz="vibead-cli-$VERSION.tgz"
          line=$(awk -v n="$tgz" '$2 == n' SHA256SUMS)
          [ "$(printf '%s\n' "$line" | grep -c .)" -eq 1 ] || { echo "SHA256SUMS must list $tgz exactly once"; exit 1; }
          printf '%s\n' "$line" | sha256sum -c -
          [ "$(tar -xOzf "$tgz" package/package.json | jq -r '.name + "@" + .version')" = "@vibead/cli@$VERSION" ] || { echo "$tgz is not @vibead/cli@$VERSION"; exit 1; }
      - working-directory: signed
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          VERSION: ${{ inputs.version }}
        run: npm publish "./vibead-cli-$VERSION.tgz" --provenance --access public --tag "$NPM_TAG"

  promote-npm:
    name: Promote on npm - add the dist-tag (mode promote, Trusted Publishing)
    if: github.ref == 'refs/heads/main' && inputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The same environment and workflow file as the npm job: the npm trusted-publisher
    # entry names release.yml and environment npm, and must also have "Allow npm dist-tag".
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # dist-tag through OIDC needs npm 11.21.0 or newer (npm 11.5.1 only publishes).
      - run: npm install -g 'npm@^11.21.0' && npm --version
      - name: The published release's signed tarball is the one npm holds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version"; exit 1; }
          tag="v$VERSION"
          tgz="vibead-cli-$VERSION.tgz"
          [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false ] || { echo "$tag must be a published release; run mode release for a draft"; exit 1; }
          mkdir signed
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir signed --pattern SHA256SUMS --pattern "$tgz"
          cd signed
          line=$(awk -v n="$tgz" '$2 == n' SHA256SUMS)
          [ "$(printf '%s\n' "$line" | grep -c .)" -eq 1 ] || { echo "SHA256SUMS must list $tgz exactly once"; exit 1; }
          printf '%s\n' "$line" | sha256sum -c -
          [ "$(tar -xOzf "$tgz" package/package.json | jq -r '.name + "@" + .version')" = "@vibead/cli@$VERSION" ] || { echo "$tgz is not @vibead/cli@$VERSION"; exit 1; }
          # npm's integrity is the SHA-512 of the tarball it stores. Equal means the signed
          # tarball is what npm serves; nothing is published here, so a mismatch stops the run.
          want="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
          have=$(npm view "@vibead/cli@$VERSION" dist.integrity)
          [ -n "$have" ] || { echo "@vibead/cli@$VERSION is not on npm; run mode release"; exit 1; }
          [ "$have" = "$want" ] || { echo "npm's @vibead/cli@$VERSION is not the signed $tgz"; exit 1; }
          echo "npm holds the signed $tgz ($VERSION)"
      # Needs "Allow npm dist-tag" on the package's trusted-publisher entry (off by default).
      # Moving a tag to the version it already has is a no-op, which is how this is rehearsed.
      - name: Add the dist-tag
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm dist-tag add "@vibead/cli@$VERSION" "$NPM_TAG"
          npm dist-tag ls @vibead/cli
          [ "$(npm view @vibead/cli "dist-tags.$NPM_TAG")" = "$VERSION" ] || { echo "dist-tag $NPM_TAG is not $VERSION"; exit 1; }

  promote-release:
    name: Promote the GitHub Release (Latest only for npm_tag latest)
    needs: promote-npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          if [ "$NPM_TAG" = latest ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          fi
