name: Installer tests

# Linux only. Runs on every pull request, so it can serve as MERGE-1/MERGE-2 in
# docs/quality/definition-of-done.md (cli#36); pushes to main still run only when
# the installers, npm launcher or README change. The PowerShell installer is exercised with pwsh on Linux (preinstalled on
# ubuntu-latest); no Windows or macOS minutes are used.
on:
  pull_request:
  push:
    branches: [main]
    paths: ['install/**', 'npm/**', 'README.md', '.github/workflows/installers.yml']

permissions:
  contents: read

concurrency:
  group: installers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: shellcheck + install.sh/install.ps1 + npm launcher (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Tools present (tests must not silently skip in CI)
        run: shellcheck --version && pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' && command -v script
      - name: Tests
        run: |
          node --test install/test/*.test.mjs .github/docs-check/status-legend.test.mjs
          cd npm && node --test
